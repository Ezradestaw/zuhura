[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zuhura-api"
version = "1.0.0"
description = "Canonical contracts, Pydantic models, and schemas for Zuhura"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0"
]
