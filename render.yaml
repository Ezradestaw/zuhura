services:
  - type: web
    name: zuhura-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: ./zuhura-backend/Dockerfile.render
    plan: free
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_PROVIDER
        value: gemini
      - key: PORT
        value: "10000"
